name: seelai_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_database: ^12.0.3
  provider: ^6.1.5+1
  firebase_messaging: ^16.2.0
  firebase_core: ^4.2.0
  camera: ^0.11.4
  intl: ^0.20.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  animated_splash_screen: ^1.3.0
  flutter_native_splash: ^2.4.7
  firebase_storage: ^13.0.4
  http: ^1.6.0
  crypto: ^3.0.7
  geolocator: ^14.0.1
  google_mlkit_text_recognition: ^0.15.0
  flutter_tts: ^4.2.3
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.1
  image: ^4.5.4
  audioplayers: ^6.5.1
  timeago: ^3.7.1
  google_sign_in: ^7.2.0
  video_player: ^2.10.1
  geocoding: ^4.0.0
  flutter_webrtc: ^1.3.1
  vibration: ^3.1.8
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.4
  uuid: ^4.5.3
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_callkit_incoming: ^3.0.0
  google_maps_flutter: ^2.14.2
  flutter_polyline_points: ^3.1.0
  flutter_vision: ^2.0.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/icons/
    - assets/models/
    - assets/emergency_images/
    # Include Vista icons directory (WebP/PNG as present)
    - assets/vista-icons/

    - assets/vista_app_logo/
    - assets/how-to-use-vista_images/partially_sighted/
    - assets/how-to-use-vista_images/caretaker/
    - assets/how-to-use-vista_images/mswd/

  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/vista_app_logo/vista_app_logo.jpg"
  adaptive_icon_background: "#FDEEA4"
  adaptive_icon_foreground: "assets/vista_app_logo/vista_app_logo.jpg"
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: "assets/vista_app_logo/vista_app_logo.jpg"
    background_color: "#FDEEA4"
    theme_color: "#13223A"

flutter_native_splash:
  color: "#13223A"
  android: true
  ios: true
